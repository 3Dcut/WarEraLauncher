<!doctype html>
<html lang="de" data-theme="grau">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>WarEra Launcher</title>
    <meta name="description" content="Dein Leitstand für WarEra: Community-Tools, Live-Daten und WarEra Radio in einem frei anpassbaren Arbeitsbereich." />
    <meta name="theme-color" content="#0b1020" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <script>
      // Theme vor dem ersten Zeichnen setzen, damit nichts aufblitzt
      try {
        var s = JSON.parse(localStorage.getItem('wl2:settings') || 'null');
        var legacy = localStorage.getItem('wl-theme');
        document.documentElement.dataset.theme = (s && s.theme) || (legacy === 'pink' ? 'pink' : 'grau');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app">
      <div class="boot" role="status">
        <div class="boot__mark" aria-hidden="true"></div>
        <p>WarEra Launcher wird geladen …</p>
        <a id="boot-fallback" href="./legacy.html" hidden>Lädt nicht? Zur alten Oberfläche</a>
      </div>
    </div>
    <noscript>
      <p style="padding: 24px; font-family: sans-serif">Der WarEra Launcher braucht JavaScript. <a href="./legacy.html">Zur alten Oberfläche</a></p>
    </noscript>
    <script>
      // Sicherheitsnetz: startet die App nicht, führt ein Link zur alten Oberfläche
      setTimeout(function () {
        var el = document.getElementById('boot-fallback');
        if (el) el.hidden = false;
      }, 12000);
    </script>
    <!-- Wird statt des Builds der Quellcode ausgeliefert, lässt sich main.tsx nicht laden: dann alte Oberfläche -->
    <script type="module" src="/src/main.tsx" onerror="location.replace('./legacy.html')"></script>
  </body>
</html>
