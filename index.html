    <script>
      // Theme und Sprache vor dem ersten Zeichnen setzen, damit nichts aufblitzt
      try {
        var s = JSON.parse(localStorage.getItem('wl2:settings') || 'null');
        var legacy = localStorage.getItem('wl-theme');
        document.documentElement.dataset.theme = (s && s.theme) || (legacy === 'pink' ? 'pink' : 'grau');
      } catch (e) {}
      // Gleiche Reihenfolge wie src/i18n: ?lang= > gespeicherte Wahl > Browser. Wer den Launcher schon
      // vor der Übersetzung kannte, bekommt beim ersten Aufruf Deutsch gespeichert.
      (function () {
        var ok = { de: 1, en: 1, sv: 1 };
        var pref = null;
        try {
          pref = JSON.parse(localStorage.getItem('wl2:lang') || 'null');
          if (pref !== 'auto' && !ok[pref]) {
            var known = localStorage.getItem('wl2:settings') || localStorage.getItem('wl-theme') || localStorage.getItem('wl-open-tools');
            pref = known ? 'de' : 'auto';
            localStorage.setItem('wl2:lang', JSON.stringify(pref));
          }
        } catch (e) {}
        var fromUrl = null;
        try {
          fromUrl = (new URLSearchParams(location.search).get('lang') || '').slice(0, 2).toLowerCase();
        } catch (e) {}
        var lang = ok[fromUrl] ? fromUrl : ok[pref] ? pref : null;
        if (!lang) {
          var list = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ''];
          for (var i = 0; i < list.length && !lang; i++) {
            var p = String(list[i]).toLowerCase().split('-')[0];
            if (ok[p]) lang = p;
            else if (p === 'nb' || p === 'nn' || p === 'no' || p === 'da') lang = 'sv';
          }
        }
        window.__bootLang = lang || 'en';
        document.documentElement.lang = window.__bootLang;
      })();
    </script>

  <body>
    <div id="app">
      <div class="boot" role="status">

        <h1 class="boot__title">WarEra Launcher</h1>
        <p id="boot-text">Community-Tools, Live-Daten und Radio werden geladen …</p>
        <a id="boot-fallback" href="./legacy.html" hidden>Lädt nicht? Zur alten Oberfläche</a>
      </div>
    </div>
    <script>
      (function () {
        var text = {
          en: ['Loading community tools, live data and radio …', 'Not loading? Go to the old interface'],
          sv: ['Communityverktyg, livedata och radio laddas …', 'Laddar det inte? Till det gamla gränssnittet'],
        }[window.__bootLang];
        if (!text) return;
        document.getElementById('boot-text').textContent = text[0];
        document.getElementById('boot-fallback').textContent = text[1];
      })();
    </script>
