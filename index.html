    <script>
      // Theme vor dem ersten Zeichnen setzen, damit nichts aufblitzt
      try {
        var s = JSON.parse(localStorage.getItem('wl2:settings') || 'null');
        var legacy = localStorage.getItem('wl-theme');
        document.documentElement.dataset.theme = (s && s.theme) || (legacy === 'pink' ? 'pink' : 'grau');
      } catch (e) {}
    </script>

        </p>
