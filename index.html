<!DOCTYPE html>
<html lang="de" data-theme="grau">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WarEra Launcher</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Source+Code+Pro:wght@400;500;600&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ========== RESET ========== */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    /* ========== THEME: GRAU ========== */
    :root[data-theme="grau"] {
      --bg-gradient: linear-gradient(135deg, #0a0e1a 0%, #111827 40%, #0f172a 100%);
      --accent: #f0b429;
      --accent-glow: rgba(240,180,41,0.25);
      --accent-dim: rgba(240,180,41,0.6);
      --text: #f0f0ec;
      --text-dim: #a0a8b4;
      --text-muted: #556070;
      --glass-bg: rgba(255,255,255,0.06);
      --glass-border: rgba(255,255,255,0.1);
      --glass-shadow: 0 8px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.08);
      --tab-active-bg: rgba(240,180,41,0.15);
      --tab-hover-bg: rgba(255,255,255,0.08);
      --font-heading: 'Rajdhani', sans-serif;
      --font-mono: 'Source Code Pro', monospace;
      --reload-hover: rgba(240,180,41,0.3);
      --danger: #ef4444;
    }

    /* ========== THEME: PINK ========== */
    :root[data-theme="pink"] {
      --bg-gradient: linear-gradient(135deg, #1f001f 0%, #300040 40%, #1a001a 100%);
      --accent: #ff00ff;
      --accent-glow: rgba(255,0,255,0.35);
      --accent-dim: rgba(255,0,255,0.6);
      --text: #ffffff;
      --text-dim: #ffccff;
      --text-muted: #996699;
      --glass-bg: rgba(255,255,255,0.04);
      --glass-border: rgba(255,0,255,0.2);
      --glass-shadow: 0 8px 32px rgba(100,0,100,0.4), inset 0 1px 0 rgba(255,255,255,0.06);
      --tab-active-bg: rgba(255,0,255,0.15);
      --tab-hover-bg: rgba(255,0,255,0.08);
      --font-heading: 'Quicksand', sans-serif;
      --font-mono: 'Source Code Pro', monospace;
      --reload-hover: rgba(255,0,255,0.3);
      --danger: #ff3366;
    }

    /* ========== BASE ========== */
    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--bg-gradient);
      color: var(--text);
      font-family: var(--font-heading);
    }

    /* ========== APP LAYOUT ========== */
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 8px;
    }

    /* ========== TOOLBAR ========== */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      border-radius: 12px;
      flex-shrink: 0;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .btn-warera {
      padding: 5px 14px;
      border-radius: 16px;
      border: 1px solid var(--accent-dim);
      background: var(--tab-active-bg);
      color: var(--accent);
      cursor: pointer;
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 13px;
      text-transform: uppercase;
      text-decoration: none;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .btn-warera:hover {
      background: var(--accent-glow);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .toolbar-sep {
      width: 1px;
      height: 22px;
      background: var(--glass-border);
    }

    /* ========== CATEGORY TABS ========== */
    .cat-tab {
      padding: 5px 14px;
      border-radius: 16px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-dim);
      cursor: pointer;
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 13px;
      transition: all 0.2s ease;
      white-space: nowrap;
      user-select: none;
    }
    .cat-tab:hover {
      background: var(--tab-hover-bg);
      color: var(--text);
    }
    .cat-tab.active {
      background: var(--tab-active-bg);
      border-color: var(--accent-dim);
      color: var(--accent);
    }

    /* ========== TOOL TABS ========== */
    .tool-tab {
      padding: 5px 12px;
      border-radius: 16px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-dim);
      cursor: pointer;
      font-family: var(--font-heading);
      font-weight: 600;
      font-size: 12px;
      transition: all 0.2s ease;
      white-space: nowrap;
    }
    .tool-tab:hover {
      background: var(--tab-hover-bg);
      color: var(--text);
    }
    .tool-tab.active {
      background: var(--tab-active-bg);
      border-color: var(--accent-dim);
      color: var(--accent);
    }
    .tool-tab .tab-emoji {
      margin-right: 4px;
    }

    .toolbar-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-theme {
      padding: 5px 14px;
      border-radius: 16px;
      border: 1px solid var(--glass-border);
      background: var(--glass-bg);
      color: var(--text-dim);
      cursor: pointer;
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 11px;
    }
    .btn-theme:hover {
      background: var(--tab-hover-bg);
      color: var(--text);
    }
    .btn-theme.active {
      background: var(--tab-active-bg);
      border-color: var(--accent-dim);
      color: var(--accent);
    }

    .stream-info {
      font-size: 11px;
      font-weight: 700;
      color: var(--accent);
      background: var(--tab-hover-bg);
      padding: 4px 10px;
      border-radius: 12px;
      border: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      gap: 10px;
      margin-right: 4px;
      white-space: nowrap;
      transition: all 0.3s ease;
    }
    .stream-info.hidden {
      display: none !important;
    }

    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--text-muted);
      margin-left: 6px;
      transition: background-color 0.3s, box-shadow 0.3s;
    }
    .status-dot.online {
      background-color: #10b981;
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
    }
    .status-dot.force {
      background-color: #f59e0b;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.7);
      animation: force-pulse 1s ease-in-out infinite;
    }
    @keyframes force-pulse {
      0%, 100% { box-shadow: 0 0 8px rgba(245, 158, 11, 0.5); }
      50% { box-shadow: 0 0 14px rgba(245, 158, 11, 0.9); }
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes magic-pulse {
      from { opacity: 0.3; transform: translate(-50%, -50%) scale(0.9); }
      to { opacity: 0.6; transform: translate(-50%, -50%) scale(1.1); }
    }

    /* ========== RADIO SIDEBAR ========== */
    .radio-sidebar {
      position: fixed;
      top: 0;
      right: -400px;
      width: 400px;
      height: 100%;
      background: rgba(10, 14, 26, 0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-left: 1px solid var(--glass-border);
      box-shadow: -8px 0 32px rgba(0,0,0,0.5);
      z-index: 10000;
      transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
    }
    :root[data-theme="pink"] .radio-sidebar {
      background: rgba(48, 0, 64, 0.95);
    }
    .radio-sidebar.open {
      right: 0;
    }
    .radio-sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid var(--glass-border);
      background: var(--glass-bg);
    }
    .radio-sidebar-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .radio-sidebar-close {
      background: transparent;
      border: none;
      color: var(--text-dim);
      font-size: 16px;
      cursor: pointer;
      border-radius: 4px;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .radio-sidebar-close:hover {
      color: var(--danger);
      background: rgba(239, 68, 68, 0.1);
    }
    .radio-sidebar-content {
      flex: 1;
      position: relative;
      background: #0d1117;
    }
    .radio-sidebar-content iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* ========== CONTENT PANEL (GRID) ========== */
    .content-panel {
      flex: 1;
      display: flex;
      flex-direction: row;
      gap: 1px;
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      border-radius: 12px;
      overflow-x: auto;
      overflow-y: hidden;
    }

    /* ========== TOOL WINDOW ========== */
    .tool-window {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 380px;
      background: #0d1117;
      border-right: 1px solid var(--glass-border);
    }
    .tool-window:last-child {
      border-right: none;
    }
    .tool-header {
      display: flex;
      align-items: center;
      padding: 6px 10px;
      background: var(--glass-bg);
      border-bottom: 1px solid var(--glass-border);
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      gap: 8px;
    }
    .tool-title {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tw-btn {
      background: transparent;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      text-decoration: none;
      font-size: 14px;
    }
    .tw-btn:hover {
      background: var(--tab-hover-bg);
      color: var(--text);
    }
    .tw-btn-close:hover {
      color: var(--danger);
      background: rgba(239, 68, 68, 0.1);
    }
    .tool-iframe-wrapper {
      flex: 1;
      position: relative;
    }
    .tool-iframe-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      color: var(--text-muted);
      font-size: 16px;
      text-align: center;
    }

    /* ========== SCHEDULE POPUP ========== */
    .btn-schedule {
      padding: 5px 10px;
      border-radius: 16px;
      border: 1px solid var(--glass-border);
      background: var(--glass-bg);
      color: var(--text-dim);
      cursor: pointer;
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 11px;
      position: relative;
    }
    .btn-schedule:hover {
      background: var(--tab-hover-bg);
      color: var(--text);
    }
    .schedule-popup {
      display: none;
      position: absolute;
      top: 100%;
      right: 0;
      margin-top: 6px;
      min-width: 280px;
      background: rgba(10, 14, 26, 0.96);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
      z-index: 9999;
      padding: 10px 14px;
      font-size: 13px;
    }
    :root[data-theme="pink"] .schedule-popup {
      background: rgba(48, 0, 64, 0.96);
    }
    .schedule-popup.open {
      display: block;
    }
    .schedule-popup-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .schedule-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 0;
      border-bottom: 1px solid var(--glass-border);
    }
    .schedule-item:last-child {
      border-bottom: none;
    }
    .schedule-time {
      font-family: var(--font-mono);
      font-weight: 600;
      font-size: 13px;
      color: var(--accent);
      min-width: 44px;
    }
    .schedule-name {
      color: var(--text);
      font-weight: 500;
    }
    .schedule-empty {
      color: var(--text-muted);
      font-size: 12px;
      padding: 4px 0;
    }

    /* ========== MOBILE: TABLET ========== */
    @media (max-width: 768px) {
      html, body {
        overflow: auto;
        overflow-x: hidden;
      }

      #app {
        height: auto;
        min-height: 100vh;
        padding: 4px;
      }

      .toolbar {
        padding: 6px 8px;
        gap: 4px;
        border-radius: 8px;
      }

      .toolbar-right {
        flex-wrap: wrap;
        gap: 4px;
        margin-left: 0;
        width: 100%;
        justify-content: flex-start;
        margin-top: 4px;
      }

      .content-panel {
        flex: none;
        flex-direction: column;
        overflow: visible;
        border-radius: 8px;
      }

      .tool-window {
        flex: none;
        border-right: none;
        border-bottom: 1px solid var(--glass-border);
        min-width: 0;
        height: 80vh;
        width: 100%;
      }

      .tool-iframe-wrapper {
        position: relative;
        flex: 1;
      }

      .tool-iframe-wrapper iframe {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }

      .radio-sidebar {
        width: 85vw;
        right: -85vw;
      }
    }

    /* ========== MOBILE: SMARTPHONE ========== */
    @media (max-width: 480px) {
      #app {
        padding: 2px;
      }

      .toolbar {
        padding: 5px 6px;
        gap: 3px;
        border-radius: 6px;
        margin-bottom: 4px;
      }

      .btn-warera {
        font-size: 12px;
        padding: 6px 10px;
      }

      .cat-tab {
        font-size: 12px;
        padding: 6px 10px;
        border-radius: 12px;
      }

      .tool-tab {
        font-size: 11px;
        padding: 6px 10px;
        border-radius: 12px;
      }

      .btn-theme {
        font-size: 10px;
        padding: 6px 10px;
      }

      .stream-info {
        font-size: 10px;
        flex-wrap: wrap;
        gap: 4px;
        width: 100%;
      }

      .toolbar-right {
        gap: 3px;
      }

      .toolbar-sep {
        display: none;
      }

      .content-panel {
        border-radius: 6px;
        min-height: 50vh;
      }

      .tool-window {
        height: 85vh;
      }

      .tool-header {
        padding: 6px 8px;
        font-size: 13px;
      }

      .radio-sidebar {
        width: 100vw;
        right: -100vw;
      }

      .empty-state {
        font-size: 14px;
        padding: 16px;
      }
    }
  </style>
</head>
<body>

  <div id="app">
    <!-- CATEGORY TOOLBAR -->
    <div class="toolbar" id="toolbar-categories" style="position: relative; z-index: 100;">
      <a class="btn-warera" href="https://app.warera.io" target="_blank">&#x1F3AE; WarEra</a>
      <div class="toolbar-sep"></div>
      <div id="category-tabs" style="display:flex;gap:4px;flex-wrap:wrap;"></div>
      <div class="toolbar-right">
        <button class="btn-theme radio-btn" data-url="https://laut.fm/war-era-de?autoplay=1" data-title="WarEra DE" title="Laut.fm WarEra DE (Sidebar)">&#x1F4FB; HAUPTRADIO (SB)</button>
        <button class="btn-theme radio-btn" data-url="https://laut.fm/warera-nachtwache?autoplay=1" data-title="Nachtwache" title="Laut.fm Nachtwache (Sidebar)">&#x1F4FB; NACHTW. (SB)</button>
        <button class="btn-theme stream-btn" data-station="war-era-de" data-stream="https://stream.laut.fm/war-era-de" title="Direkt-Stream Hauptradio"><span class="stream-icon">&#x25B6;</span> HAUPTRADIO <span class="status-dot" id="dot-war-era-de" title="Offline (AutoDJ)"></span></button>
        <button class="btn-theme stream-btn" data-station="warera-nachtwache" data-stream="https://stream.laut.fm/warera-nachtwache" title="Direkt-Stream Nachtwachenradio"><span class="stream-icon">&#x25B6;</span> NACHTWACHENRADIO <span class="status-dot" id="dot-warera-nachtwache" title="Offline (AutoDJ)"></span></button>
        <div class="toolbar-sep" style="height: 18px; margin: 0 4px;"></div>
        <button class="btn-theme" id="auto-radio-toggle" title="Automatischer Sender-Wechsel (prüft minütlich den Claim)">&#x1F916; AUTO: OFF</button>
        <div style="position:relative;display:inline-block;">
          <button class="btn-schedule" id="btn-schedule-preview" title="Nächste geplante Einspieler">&#x1F4CB; PLAN</button>
          <div class="schedule-popup" id="schedule-popup">
            <div class="schedule-popup-title">Nächste Einspieler</div>
            <div id="schedule-popup-list"></div>
          </div>
        </div>
        <div class="toolbar-sep" style="height: 18px; margin: 0 4px;"></div>
        <div class="stream-info hidden" id="stream-info">
          <span id="si-song"></span>
          <span id="si-listeners"></span>
          <span title="Lautstärke" style="display:flex; align-items:center; gap: 4px; margin-left: 6px;">
            &#x1F50A; <input type="range" id="stream-volume" min="0" max="1" step="0.01" value="0.65" style="width: 120px; cursor: pointer; accent-color: var(--accent);">
          </span>
        </div>
        <button class="btn-theme" id="theme-toggle">&#x25C9; GRAU</button>
      </div>
    </div>

    <!-- TOOLS TOOLBAR -->
    <div class="toolbar" id="toolbar-tools" style="margin-top:-4px; padding-top:4px; padding-bottom:4px;">
      <div id="tool-launchers" style="display:flex;gap:4px;flex-wrap:wrap;"></div>
    </div>

    <div class="content-panel" id="content-panel"></div>
  </div>


  <!-- RADIO SIDEBAR (2. Implementierung) -->
  <div class="radio-sidebar" id="radio-sidebar">
    <div class="radio-sidebar-header">
      <div class="radio-sidebar-title" id="radio-sidebar-title-text">&#x1F3B5; Laut.fm Radio</div>
      <button class="radio-sidebar-close" id="radio-sidebar-close" title="Schließen">&#x2715;</button>
    </div>
    <div class="radio-sidebar-content">
      <iframe src="about:blank" allow="autoplay" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
    </div>
  </div>

  <script>
    const state = {
      theme: localStorage.getItem('wl-theme') || 'grau',
      activeCategory: parseInt(localStorage.getItem('wl-active-cat') || '0', 10),
      categories: [],
      openTools: [],
      radioSchedule: null,
      audioSchedule: null,
      playedInserts: new Set()
    };

    const $ = id => document.getElementById(id);
    const categoryTabsEl = $('category-tabs');
    const toolLaunchersEl = $('tool-launchers');
    const contentPanelEl = $('content-panel');
    const themeToggle = $('theme-toggle');

    async function init() {
      applyTheme(state.theme);

      try {
        const res = await fetch('./tools.json?t=' + Date.now());
        state.categories = await res.json();
      } catch (e) {
        state.categories = [];
      }

      try {
        const schedRes = await fetch('./radio_schedule.json?t=' + Date.now());
        state.radioSchedule = await schedRes.json();
      } catch (e) {
        console.warn('Kein Zeitplan gefunden');
      }

      try {
        const audioRes = await fetch('./audio_schedule.json?t=' + Date.now());
        state.audioSchedule = await audioRes.json();
      } catch (e) {
        console.warn('Kein Audio-Einspieler-Zeitplan gefunden');
      }

      try {
        const saved = JSON.parse(localStorage.getItem('wl-open-tools'));
        if (Array.isArray(saved) && saved.length > 0) state.openTools = saved;
      } catch(e) {}

      if (state.categories.length > 0) {
        if (state.activeCategory >= state.categories.length) state.activeCategory = 0;
        renderCategories();
        renderLauncherButtons();
        
        renderOpenTools();
      }
    }

    function applyTheme(theme) {
      state.theme = theme;
      document.documentElement.dataset.theme = theme;
      localStorage.setItem('wl-theme', theme);
      themeToggle.innerHTML = theme === 'pink' ? '&#x2665; PINK' : '&#x25C9; GRAU';
    }

    themeToggle.addEventListener('click', () => {
      applyTheme(state.theme === 'grau' ? 'pink' : 'grau');
    });


    // Sidebar Logic
    const radioSidebar = $('radio-sidebar');
    const radioSidebarTitle = $('radio-sidebar-title-text');
    const radioIframe = radioSidebar.querySelector('iframe');
    const radioSidebarClose = $('radio-sidebar-close');

    document.querySelectorAll('.radio-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const url = btn.getAttribute('data-url');
        const title = btn.getAttribute('data-title');
        
        radioSidebarTitle.innerHTML = '&#x1F3B5; Laut.fm ' + title;
        if (radioIframe.src !== url) {
          radioIframe.src = url;
        }
        radioSidebar.classList.add('open');
      });
    });

    radioSidebarClose.addEventListener('click', () => {
      radioSidebar.classList.remove('open');
    });

    // Native Stream Logic
    let currentStreamAudio = null;
    let currentStreamBtn = null;
    let streamInfoInterval = null;
    let autoSwitching = false; // Flag um programmatische Klicks von manuellen zu unterscheiden
    // Globaler Online-Status für Jingle-Logik
    let stationStatus = { mainOnline: false, nachtOnline: false, mainForce: false, nachtForce: false };

    const streamInfoBox = $('stream-info');
    const siSong = $('si-song');
    const siListeners = $('si-listeners');
    const streamVolume = $('stream-volume');

    streamVolume.addEventListener('input', (e) => {
      if (currentStreamAudio && !insertPlaying) {
        currentStreamAudio.volume = e.target.value;
      }
      if (insertPlaying) {
        insertAudio.volume = e.target.value;
      }
    });

    async function fetchStreamInfo(station) {
      if (!currentStreamAudio || currentStreamAudio.paused) return;
      try {
        const [songRes, listRes] = await Promise.all([
          fetch(`https://api.laut.fm/station/${station}/current_song`),
          fetch(`https://api.laut.fm/station/${station}/listeners`)
        ]);
        if (songRes.ok && listRes.ok) {
          const songData = await songRes.json();
          const listText = await listRes.text();
          siSong.innerHTML = `&#x1F3B5; ${songData.artist.name} - ${songData.title}`;
          siListeners.innerHTML = `&#x1F3A7; ${listText.trim()} Sparschäler`;
        }
      } catch (e) {
        console.error("Fehler beim Laden der API-Daten", e);
      }
    }

    function stopStreamInfo() {
      streamInfoBox.classList.add('hidden');
      if (streamInfoInterval) {
        clearInterval(streamInfoInterval);
        streamInfoInterval = null;
      }
    }

    function startStreamInfo(station) {
      streamInfoBox.classList.remove('hidden');
      siSong.innerHTML = '&#x1F3B5; Lade Info...';
      siListeners.innerHTML = '';
      fetchStreamInfo(station);
      streamInfoInterval = setInterval(() => fetchStreamInfo(station), 15000);
    }

    /**
     * Startet einen Stream programmatisch (ohne Auto auszuschalten).
     * Wird von der Auto-Logik und beim Seitenstart verwendet.
     */
    function startStationStream(station) {
      const targetBtn = document.querySelector(`.stream-btn[data-station="${station}"]`);
      if (!targetBtn) return;

      // Bereits aktiv? Nichts tun.
      if (targetBtn.classList.contains('active') && currentStreamAudio && !currentStreamAudio.paused) return;

      autoSwitching = true;
      targetBtn.click();
      autoSwitching = false;
    }

    document.querySelectorAll('.stream-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        // Nur bei manuellem Klick (nicht programmatisch durch Auto) → AUTO ausschalten
        if (!autoSwitching && autoRadioActive) {
          autoRadioActive = false;
          localStorage.setItem('wl-auto-radio', 'false');
          autoRadioToggle.classList.remove('active');
          autoRadioToggle.innerHTML = '&#x1F916; AUTO: OFF';
        }

        const streamUrl = btn.getAttribute('data-stream');
        const station = btn.getAttribute('data-station');
        const iconSpan = btn.querySelector('.stream-icon');
        
        // If clicking the same active button
        if (currentStreamAudio && currentStreamBtn === btn) {
          if (!currentStreamAudio.paused) {
            currentStreamAudio.pause();
            iconSpan.innerHTML = '&#x25B6;'; // Play
            btn.classList.remove('active');
            stopStreamInfo();
            localStorage.removeItem('wl-last-station');
          } else {
            currentStreamAudio.play();
            iconSpan.innerHTML = '&#x23F8;'; // Pause
            btn.classList.add('active');
            startStreamInfo(station);
            localStorage.setItem('wl-last-station', station);
          }
          return;
        }

        // Stop existing
        if (currentStreamAudio) {
          currentStreamAudio.pause();
          currentStreamAudio.src = '';
          currentStreamAudio = null;
          if (currentStreamBtn) {
            currentStreamBtn.querySelector('.stream-icon').innerHTML = '&#x25B6;';
            currentStreamBtn.classList.remove('active');
          }
          stopStreamInfo();
        }

        // Play new
        currentStreamAudio = new Audio(streamUrl + "?t=" + Date.now());
        currentStreamAudio.volume = streamVolume.value;
        currentStreamAudio.play();
        currentStreamBtn = btn;
        iconSpan.innerHTML = '&#x23F8;'; // Pause
        btn.classList.add('active');
        startStreamInfo(station);

        // Letzten aktiven Sender merken
        localStorage.setItem('wl-last-station', station);
      });

    }

    autoRadioToggle.addEventListener('click', () => {
      autoRadioActive = !autoRadioActive;
      localStorage.setItem('wl-auto-radio', autoRadioActive);

        autoRadioToggle.classList.add('active');
        autoRadioToggle.innerHTML = '&#x1F916; AUTO: ON';
        pollStationData(); // sofort einmal ausführen

    function getScheduledStation() {
      if (!state.radioSchedule || !state.radioSchedule.schedule) return null;
      const now = new Date();
      const timeFloat = now.getHours() + (now.getMinutes() / 60);
      
      for (let item of state.radioSchedule.schedule) {
        const startParts = item.start.split(':').map(Number);
        const endParts = item.end.split(':').map(Number);
        const startF = startParts[0] + (startParts[1] || 0) / 60;
        const endF = endParts[0] + (endParts[1] || 0) / 60;

        if (startF > endF) {
           if (timeFloat >= startF || timeFloat < endF) return item.station;
        } else {
           if (timeFloat >= startF && timeFloat < endF) return item.station;
        }
      }
      return null;
    }

    async function pollStationData() {
      try {
        const timestamp = Date.now();
        const [resMain, resNacht] = await Promise.all([
          fetch(`https://api.laut.fm/station/war-era-de?t=${timestamp}`),
          fetch(`https://api.laut.fm/station/warera-nachtwache?t=${timestamp}`)
        ]);
        
        if (!resMain.ok || !resNacht.ok) return;
        
        const dataMain = await resMain.json();
        const dataNacht = await resNacht.json();
        
        const mainFmt = (dataMain.format || '').toLowerCase();
        const nachtFmt = (dataNacht.format || '').toLowerCase();
        const isMainForce = mainFmt.includes('force');
        const isNachtForce = nachtFmt.includes('force');
        const isMainOnline = isMainForce || mainFmt.includes('online');
        const isNachtOnline = isNachtForce || nachtFmt.includes('online');
        
        // Globalen Status aktualisieren (für Jingle-Logik)
        stationStatus = { mainOnline: isMainOnline, nachtOnline: isNachtOnline, mainForce: isMainForce, nachtForce: isNachtForce };
        
        // Dots aktualisieren
        // Dot-Status: force > online > offline
        dotMain.classList.remove('online', 'force');
        if (isMainForce) {
          dotMain.classList.add('force');
          dotMain.title = "FORCE (Priorität)";
        } else if (isMainOnline) {
          dotMain.classList.add('online');
          dotMain.title = "Live/Online";
        } else {
          dotMain.title = "Offline (AutoDJ)";
        }
        
        dotNacht.classList.remove('online', 'force');
        if (isNachtForce) {
          dotNacht.classList.add('force');
          dotNacht.title = "FORCE (Priorität)";
        } else if (isNachtOnline) {
          dotNacht.classList.add('online');
          dotNacht.title = "Live/Online";
        } else {
          dotNacht.title = "Offline (AutoDJ)";
        }
        
        // Auto-Wechsel Logik – force sticht online
        if (autoRadioActive) {
          let targetStation = null;
          
          // 1. Force hat höchste Priorität
          if (isMainForce && isNachtForce) {
             // Beide force: letzten Sender als Fallback
             targetStation = localStorage.getItem('wl-last-station') || 'war-era-de';
          } else if (isMainForce) {
             targetStation = 'war-era-de';
          } else if (isNachtForce) {
             targetStation = 'warera-nachtwache';
          }
          // 2. Dann online
          else if (isNachtOnline && isMainOnline) {
             // Wenn beide online: letzten Sender als Fallback nehmen
             targetStation = localStorage.getItem('wl-last-station') || 'war-era-de';
          } else if (isNachtOnline) {
             targetStation = 'warera-nachtwache';
          } else if (isMainOnline) {
             targetStation = 'war-era-de';
          } else {
             // 3. Wenn keiner online/force: Zeitplan als Fallback
             targetStation = getScheduledStation();
          }
          
          if (targetStation) {
            startStationStream(targetStation);
          }
        }
      } catch (err) {
        console.error("Fehler beim Radio Status Polling:", err);
      }
    }

    // Sofort beim Start poll aufrufen, danach jede Minute
    // Wenn Auto aktiv ist, wird pollStationData den richtigen Sender starten

    setInterval(pollStationData, 60000);

      renderOpenTools();
      renderLauncherButtons();

    init();

    // ========== EINSPIELER / INSERT SCHEDULING ==========
    const insertAudio = document.createElement('audio');
    insertAudio.preload = 'auto';
    document.body.appendChild(insertAudio);
    let insertPlaying = false;

    function getCurrentTimeKey() {
      const now = new Date();
      return String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
    }

    function getTodayKey() {
      const now = new Date();
      return now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
    }

    function fadeAudio(audio, from, to, duration) {
      return new Promise(resolve => {
        const steps = 20;
        const stepTime = duration / steps;
        const stepVal = (to - from) / steps;
        let current = from;
        let step = 0;
        const interval = setInterval(() => {
          step++;
          current += stepVal;
          audio.volume = Math.max(0, Math.min(1, current));
          if (step >= steps) {
            clearInterval(interval);
            audio.volume = Math.max(0, Math.min(1, to));
            resolve();
          }
        }, stepTime);
      });
    }

    async function playInsert(insert) {
      if (insertPlaying) return;
      insertPlaying = true;

      const savedVolume = currentStreamAudio ? currentStreamAudio.volume : parseFloat(streamVolume.value);
      const streamActive = currentStreamAudio && !currentStreamAudio.paused;

      // Fade stream to 0 but keep it playing
      if (streamActive) {
        await fadeAudio(currentStreamAudio, savedVolume, 0, 500);
      }

      // Show insert info
      streamInfoBox.classList.remove('hidden');
      siSong.innerHTML = '&#x1F399; Einspieler: ' + insert.name;
      siListeners.innerHTML = '';

      // Play insert as separate audio stream (reuse persistent element)
      insertAudio.src = insert.file + '?t=' + Date.now();
      insertAudio.volume = savedVolume;

      try {
        const endedPromise = new Promise((resolve, reject) => {
          insertAudio.addEventListener('ended', resolve, { once: true });
          insertAudio.addEventListener('error', reject, { once: true });
        });
        await insertAudio.play();
        await endedPromise;
      } catch (e) {
        console.error('Einspieler-Fehler:', e);
      } finally {
        insertAudio.src = '';

        // Stream wiederherstellen — auch wenn er während des Inserts pausiert wurde
        if (streamActive && currentStreamAudio) {
          if (currentStreamAudio.paused) {
            try { await currentStreamAudio.play(); } catch (e) { /* Autoplay blocked */ }
          }
          await fadeAudio(currentStreamAudio, 0, savedVolume, 500);
          if (currentStreamBtn) {
            const station = currentStreamBtn.getAttribute('data-station');
            fetchStreamInfo(station);
          }
        } else {
          streamInfoBox.classList.add('hidden');
        }

        insertPlaying = false;
      }
    }

    let pendingInsertTimeout = null;

    async function getSecondsUntilSongEnd(station) {
      try {
        const res = await fetch(`https://api.laut.fm/station/${station}/current_song?t=${Date.now()}`);
        if (!res.ok) return 0;
        const song = await res.json();
        if (!song.ends_at) return 0;

        // Parse "2026-04-06 16:56:53 +0200" format
        const endsAt = new Date(song.ends_at.replace(' ', 'T').replace(/ ([+-])/, '$1'));
        const now = new Date();
        const diffMs = endsAt.getTime() - now.getTime();

        console.log(`Song "${song.artist?.name} - ${song.title}" endet in ${Math.round(diffMs / 1000)}s`);
        return Math.max(0, diffMs);
      } catch (e) {
        console.error('Song-Ende konnte nicht ermittelt werden:', e);
        return 0;
      }
    }

    async function scheduleInsertAfterSong(insert) {
      // Aktuellen Sender ermitteln
      const station = currentStreamBtn ? currentStreamBtn.getAttribute('data-station') : null;

      if (!station || !currentStreamAudio || currentStreamAudio.paused) {
        // Kein Stream aktiv → Einspieler überspringen
        console.log('Kein aktiver Stream, Einspieler übersprungen:', insert.name);
        return;
      }

      let msUntilEnd = await getSecondsUntilSongEnd(station);

      if (msUntilEnd <= 2000) {
        // Song endet in <2s oder Fehler → sofort abspielen
        console.log('Song endet gleich, Einspieler sofort:', insert.name);
        playInsert(insert);
        return;
      }

      // 2s Puffer damit der Song wirklich vorbei ist bevor der Einspieler startet
      msUntilEnd += 2000;

      // Warten bis Song endet, dann Einspieler starten
      console.log(`Warte ${Math.round(msUntilEnd / 1000)}s auf Song-Ende, dann Einspieler: ${insert.name}`);

      // Info anzeigen, dass Einspieler wartet
      streamInfoBox.classList.remove('hidden');
      siListeners.innerHTML = `&#x23F3; Einspieler "${insert.name}" wartet auf Song-Ende...`;

      if (pendingInsertTimeout) clearTimeout(pendingInsertTimeout);
      pendingInsertTimeout = setTimeout(() => {
        pendingInsertTimeout = null;
        console.log('Song vorbei, starte Einspieler:', insert.name);
        playInsert(insert);
      }, msUntilEnd);
    }

    async function reloadAudioSchedule() {
      try {
        const audioRes = await fetch('./audio_schedule.json?t=' + Date.now());
        state.audioSchedule = await audioRes.json();
      } catch (e) {
        console.warn('Audio-Zeitplan konnte nicht neu geladen werden');
      }
    }

    // Alle 60 Sekunden audio_schedule.json neu laden
    setInterval(reloadAudioSchedule, 60000);

    function isJingleTime(timeKey) {
      const mins = parseInt(timeKey.split(':')[1], 10);
      return mins % 15 === 0;
    }

    function hasScheduledInsertAt(timeKey, todayKey) {
      if (!state.audioSchedule || !state.audioSchedule.inserts) return false;
      for (const insert of state.audioSchedule.inserts) {
        if (insert.date && insert.date !== todayKey) continue;
        if (insert.time === timeKey) return true;
      }
      return false;
    }

    function getJingleForStatus() {
      const jConf = state.audioSchedule && state.audioSchedule.jingles;
      if (!jConf) return null;

      // Jingle richtet sich nach dem aktuell laufenden Stream + Online-Status
      const activeStation = currentStreamBtn ? currentStreamBtn.getAttribute('data-station') : null;

      if (activeStation === 'war-era-de') {
        if (stationStatus.mainOnline || stationStatus.mainForce) {
          // Main online → zeitbasiert abwechselnd
          const mins = new Date().getMinutes();
          if (mins === 0 || mins === 30) {
            // Volle & halbe Stunde → Nur das Beste auf die Ohren
            return { file: jConf.main_alt, name: 'Nur das Beste auf die Ohren' };
          } else {
            // :15 und :45 → Main-Jingle
            return { file: jConf.main, name: 'Jingle (Hauptradio)' };
          }
        } else {
          // Kein online/force Claim → Offline-Jingle
          return { file: jConf.none, name: 'Jingle (Offline)' };
        }
      }

      if (activeStation === 'warera-nachtwache') {
        if (stationStatus.nachtOnline || stationStatus.nachtForce) {
          return { file: jConf.nachtwache, name: 'Jingle (Nachtwache)' };
        } else {
          return { file: jConf.none, name: 'Jingle (Offline)' };
        }
      }

      return null;
    }

    function checkInsertSchedule() {
      if (!state.audioSchedule) return;
      if (insertPlaying || pendingInsertTimeout) return; // Bereits aktiv oder wartend

      // Einspieler nur wenn Radio tatsächlich läuft
      if (!currentStreamAudio || currentStreamAudio.paused) return;

      const timeKey = getCurrentTimeKey();
      const todayKey = getTodayKey();

      // 1. Reguläre Einspieler prüfen
      let regularFound = false;
      if (state.audioSchedule.inserts) {
        for (const insert of state.audioSchedule.inserts) {
          if (insert.date && insert.date !== todayKey) continue;

          const insertId = todayKey + '_' + insert.time + '_' + (insert.name || '');
          if (insert.time === timeKey && !state.playedInserts.has(insertId)) {
            state.playedInserts.add(insertId);
            const dateHint = insert.date ? ` (einmalig am ${insert.date})` : ' (täglich)';
            console.log('Einspieler geplant:', insert.name, 'um', timeKey + dateHint);
            scheduleInsertAfterSong(insert);
            regularFound = true;
            break;
          }
        }
      }

      // 2. Jingle alle 15 Min, nur falls kein regulärer Einspieler zur gleichen Zeit
      if (!regularFound && isJingleTime(timeKey) && !hasScheduledInsertAt(timeKey, todayKey)) {
        const jingleId = todayKey + '_jingle_' + timeKey;
        if (!state.playedInserts.has(jingleId)) {
          const jingle = getJingleForStatus();
          if (jingle && jingle.file) {
            state.playedInserts.add(jingleId);
            console.log('Jingle geplant:', jingle.name, 'um', timeKey);
            scheduleInsertAfterSong(jingle);
          }
        }
      }
    }

    // Alle 15 Sekunden prüfen
    setInterval(checkInsertSchedule, 15000);

    // Täglich played-Set zurücksetzen (um Mitternacht)
    let lastDay = getTodayKey();
    setInterval(() => {
      const today = getTodayKey();
      if (today !== lastDay) {
        state.playedInserts.clear();
        lastDay = today;
      }
    }, 60000);

    // ========== SCHEDULE PREVIEW POPUP ==========
    const btnSchedulePreview = $('btn-schedule-preview');
    const schedulePopup = $('schedule-popup');
    const schedulePopupList = $('schedule-popup-list');

    function getNextInserts(count) {
      if (!state.audioSchedule) return [];
      const now = new Date();
      const todayKey = getTodayKey();
      const nowMinutes = now.getHours() * 60 + now.getMinutes();

      const upcoming = [];
      const occupiedTimes = new Set();

      // 1. Reguläre Einspieler sammeln
      if (state.audioSchedule.inserts) {
        for (const insert of state.audioSchedule.inserts) {
          if (insert.date && insert.date !== todayKey) continue;

          const parts = insert.time.split(':').map(Number);
          const insertMinutes = parts[0] * 60 + parts[1];

          if (insertMinutes > nowMinutes) {
            upcoming.push({ time: insert.time, name: insert.name, minutes: insertMinutes, isJingle: false });
            occupiedTimes.add(insert.time);
          }
        }
      }

      // 2. Jingles alle 15 Min hinzufügen (nur wo kein regulärer Einspieler liegt)
      if (state.audioSchedule.jingles) {
        const jingle = getJingleForStatus();
        if (jingle) {
          for (let m = nowMinutes + 1; m < 24 * 60; m++) {
            if (m % 15 !== 0) continue;
            const h = String(Math.floor(m / 60)).padStart(2, '0');
            const mi = String(m % 60).padStart(2, '0');
            const tKey = h + ':' + mi;
            if (!occupiedTimes.has(tKey)) {
              upcoming.push({ time: tKey, name: '🔔 ' + jingle.name, minutes: m, isJingle: true });
            }
          }
        }
      }

      // Nach Zeit sortieren
      upcoming.sort((a, b) => a.minutes - b.minutes);
      return upcoming.slice(0, count);
    }

    function renderSchedulePopup() {
      const items = getNextInserts(3);
      if (items.length === 0) {
        schedulePopupList.innerHTML = '<div class="schedule-empty">Keine weiteren Einspieler heute geplant.</div>';
        return;
      }
      schedulePopupList.innerHTML = items.map(it =>
        `<div class="schedule-item"><span class="schedule-time">${it.time}</span><span class="schedule-name">${it.name}</span></div>`
      ).join('');
    }

    btnSchedulePreview.addEventListener('click', (e) => {
      e.stopPropagation();
      const isOpen = schedulePopup.classList.contains('open');
      if (isOpen) {
        schedulePopup.classList.remove('open');
      } else {
        renderSchedulePopup();
        schedulePopup.classList.add('open');
      }
    });

    document.addEventListener('click', (e) => {
      if (!schedulePopup.contains(e.target) && e.target !== btnSchedulePreview) {
        schedulePopup.classList.remove('open');
      }
    });
  </script>
</body>
</html>
